<!DOCTYPE html>
<html lang="en">
<head>

<title>SOR App</title>

<style>
:root{--navy:#0B3B5A;--navy2:#164B6E;--green:#0B8530;--green-d:#0A6B27;--orange:#EE6F30;--ink:#16222B;--ink2:#36434D;--mute:#5A6670;--line:#DCD7CE;--line2:#BDB6AA;--bg:#F4F2EE;--card:#fff;--red:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:#E9E6E0;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:140px}
.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
.wide{max-width:1100px!important}
.tw{overflow-x:auto;background:var(--card,#fff);border:1px solid var(--line);border-radius:12px}
.tt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tt th,.tt td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tt th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--mute);background:#F7F5F1}
.tt td.n,.tt th.n{text-align:right}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.wk{display:flex;align-items:flex-end;gap:8px;height:150px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--mute);min-width:0}
.wk b{display:block;width:100%;background:var(--navy);border-radius:4px 4px 0 0;min-height:2px}
.wk span.v{font-weight:800;color:var(--ink);font-size:12px}
.install{display:none;margin:12px 16px 0;background:#E1ECF3;color:#0B3B5A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;align-items:center;gap:10px}
.install.show{display:flex}
.install button{margin-left:auto;min-height:40px;border:none;border-radius:10px;background:#0B3B5A;color:#fff;font-weight:800;padding:0 14px}
.top-row{display:flex;align-items:center;gap:8px}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px;line-height:1.1}
.sub{font-size:12px;color:#BFD3E0}
.iconbtn{width:44px;height:44px;border:none;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.iconbtn:active{background:rgba(255,255,255,.12)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--navy2);border-radius:10px;padding:10px 8px;border:none;color:#fff;text-align:left}
.stat b{display:block;font-size:26px;line-height:1}
.stat span{font-size:11px;color:#D5E3EC}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px}
.chip{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{padding:8px 16px 0}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line2);padding:0 12px;background:#fff;font-size:15px}
.list{padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;text-align:left;width:100%}
.rac{width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:20px;line-height:1}
.rac small{font-size:9px;font-weight:700;letter-spacing:.5px}
.rE{background:#7A1010;color:#fff}.rH{background:var(--orange);color:#1A0E05}.rM{background:#F2C230;color:#231A00}.rL{background:var(--green);color:#fff}.rP{background:#E1ECF3;color:var(--navy)}
.meta{font-size:12px;color:var(--mute);font-weight:600}
.ttl{font-size:15px;font-weight:700;margin:2px 0}
.desc{font-size:13px;color:var(--ink2);line-height:1.4}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;white-space:nowrap}
.s-open{background:#FDEBD9;color:#9A3A0B}.s-overdue{background:var(--red);color:#fff}.s-closed{background:#DDEFE2;color:var(--green-d)}.s-positive{background:#E1ECF3;color:var(--navy)}
.empty{text-align:center;color:var(--mute);padding:40px 16px;font-size:14px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:calc(min(560px,100%) - 32px);height:56px;border:none;border-radius:14px;background:var(--orange);color:#1A0E05;font-size:17px;font-weight:800;box-shadow:0 6px 16px rgba(11,59,90,.25);z-index:6;display:flex;align-items:center;justify-content:center;gap:8px}
.form{padding:16px;display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{font-size:13px;font-weight:800;color:var(--navy);letter-spacing:.3px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.inp{height:46px;border-radius:10px;border:1px solid var(--line2);background:#fff;padding:0 10px;font-size:16px;width:100%;min-width:0}
textarea.inp{height:auto;padding:10px;resize:vertical;min-height:76px;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:46px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:600;padding:6px 10px;text-align:left}
.opt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.on.pos{background:var(--green);border-color:var(--green)}
.cat{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600}
.cat.on{background:var(--orange);border-color:var(--orange);color:#1A0E05}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.ref{font-size:12px;background:#E1ECF3;border-radius:8px;padding:8px 10px;color:var(--ink2)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;height:96px;border-radius:10px;overflow:hidden;background:#D9D4CB}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.addph{height:96px;border:2px dashed var(--navy);border-radius:10px;background:#fff;color:var(--navy);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.addph.after{border-color:var(--green);color:var(--green-d)}
.matrix{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:78px repeat(5,minmax(0,1fr));gap:5px;align-items:center}
.mh{font-size:10px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.15}
.ml{font-size:11px;font-weight:700;color:var(--ink2);line-height:1.15}
.mc{height:44px;border:none;border-radius:8px;font-weight:800;font-size:18px;opacity:.5}
.mc.on{opacity:1;outline:3px solid var(--navy);outline-offset:2px}
.racnow{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px}
.toggle{min-height:52px;border-radius:12px;border:2px solid var(--line2);background:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:15px;font-weight:700;text-align:left;width:100%}
.toggle .box{width:26px;height:26px;border-radius:6px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toggle.on{background:#FDECEA;border-color:var(--red);color:#9A1C12}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;z-index:6}
.btn{min-height:52px;border-radius:12px;border:none;font-size:15px;font-weight:800;padding:0 12px}
.b-navy{background:var(--navy);color:#fff}.b-green{background:var(--green);color:#fff}.b-ghost{background:#fff;border:2px solid var(--navy);color:var(--navy)}.b-ghostg{background:#fff;border:2px solid var(--green);color:var(--green-d)}.b-red{background:#fff;border:2px solid var(--red);color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.3px}
.val{font-size:14px;line-height:1.5;white-space:pre-wrap}
.trail{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px}
.dot{width:14px;height:14px;border-radius:7px;border:2px solid var(--line2);background:#fff;margin-top:3px;flex-shrink:0}
.dot.on{background:var(--green);border-color:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;width:calc(min(560px,100%) - 32px);background:var(--green);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.setrow{display:flex;flex-direction:column;gap:8px}
.hint{font-size:12px;color:var(--mute);line-height:1.4}
#print{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff}
  #app,.fab,.bar,.toast{display:none!important}
  #print{display:block}
}
/* report */
.rp{font-size:11px;color:#16222B;font-family:Arial,Helvetica,sans-serif}
.rp-page{page-break-after:always}
.rp-page:last-child{page-break-after:auto}
.rp-head{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0B3B5A;padding-bottom:8px;margin-bottom:8px}
.rp-head h1{margin:0;font-size:20px;color:#0B3B5A;letter-spacing:.3px}
.rp-logo{width:56px;height:56px;border-radius:28px;border:1px dashed #5A6670;display:flex;align-items:center;justify-content:center;font-size:8px;color:#5A6670;text-align:center;flex-shrink:0}
.rp table{width:100%;border-collapse:collapse}
.rp td,.rp th{border:1px solid #16222B;padding:4px 6px;vertical-align:top;text-align:left}
.rp th{background:#EEF3F6;width:22%;font-weight:700}
.rp-sec{margin-top:8px;border:1px solid #16222B}
.rp-sec h2{margin:0;padding:4px 8px;font-size:12px;color:#fff;background:#0B3B5A;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-sec .in{padding:6px 8px;white-space:pre-wrap;line-height:1.45}
.rp .ck{display:inline-block;width:10px;height:10px;border:1.3px solid #16222B;margin-right:4px;vertical-align:-1px}
.rp .ck.on{background:#0B3B5A;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-ph{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 8px}
.rp-ph img{width:100%;height:190px;object-fit:cover;border:1px solid #BDB6AA}
.rp-ph .none{height:190px;border:1px solid #BDB6AA;display:flex;align-items:center;justify-content:center;color:#5A6670}
.rp-sig{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #16222B;margin-top:8px}
.rp-sig div{padding:6px 8px;border-right:1px solid #BDB6AA;min-height:62px}
.rp-sig div:last-child{border-right:none}
.rp-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:9px;color:#36434D;border-top:1px solid #BDB6AA;padding-top:4px}
.rp *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp .racb{display:inline-block;padding:1px 8px;border-radius:4px;font-weight:700}
.rp-reg td,.rp-reg th{font-size:10px;width:auto}
.rp-reg tr{page-break-inside:avoid}
.rp-reg thead{display:table-header-group}
</style>
</head>
<body>
<div id="app"><noscript><div style="padding:24px;font:16px/1.5 sans-serif">This app needs JavaScript. Open the file in Chrome or Safari, not in a file preview or HTML viewer.</div></noscript></div>

<script>
(function(){
'use strict';
// ---------- constants ----------
var CATS = {
  'Fall Protection':'EM 385-1-1 · Section 21 Fall Protection',
  'PPE':'EM 385-1-1 · Section 05 Personal Protective Equipment',
  'Housekeeping':'EM 385-1-1 · Section 14 Material Handling & Housekeeping',
  'Electrical':'EM 385-1-1 · Section 11 Electrical',
  'Scaffolding':'EM 385-1-1 · Section 22 Work Platforms',
  'Excavation':'EM 385-1-1 · Section 25 Excavations',
  'Lifting & Rigging':'EM 385-1-1 · Section 16 Cranes & Hoisting',

  'Environmental':'EM 385-1-1 · Section 06 / Environmental Protection Plan',
  'Other':''
};
var TYPES = ['Unsafe Act','Unsafe Condition','Near Miss','Positive','Environmental','Health / Hygiene'];
var SEVS = ['Catastrophic','Critical','Marginal','Negligible'];
var PROBS = ['Frequent','Likely','Occasional','Seldom','Unlikely'];
var M = [['E','E','H','H','M'],['E','H','H','M','L'],['H','M','M','L','L'],['M','L','L','L','L']];
var RACN = {E:'Extremely High',H:'High',M:'Moderate',L:'Low','+':'Positive'};
var RACC = {E:['#7A1010','#fff'],H:['#EE6F30','#1A0E05'],M:['#F2C230','#231A00'],L:['#0B8530','#fff'],'+':['#E1ECF3','#0B3B5A']};
var DEF_SETTINGS = {observer:'',initials:'',designation:'SSHO',project:'',contract:'',prime:'Yamauchi Gumi MVL',
  locations:'Bldg 710 · Level 1\nBldg 710 · Level 3\nBldg 710 · Roof\nLaydown yard\nGate 3',
  contractors:'Yamauchi Gumi MVL (Prime)\nSubcontractor A\nSubcontractor B', docno:'HSE-YGMVL-SOR', seq:0};

// ---------- storage (IndexedDB, falls back to memory) ----------
var db=null, mem={items:{},meta:{}};
var storeMode='memory';
function lsOK(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}
function lsSave(){if(storeMode!=='local')return;try{localStorage.setItem('sor-app-items',JSON.stringify(mem.items));localStorage.setItem('sor-app-meta',JSON.stringify(mem.meta));}catch(e){showStorageWarn('Phone storage is full — export a backup and delete old records.');}}
function lsLoad(){try{mem.items=JSON.parse(localStorage.getItem('sor-app-items')||'{}')||{};mem.meta=JSON.parse(localStorage.getItem('sor-app-meta')||'{}')||{};}catch(e){}}
function openDB(){return new Promise(function(res){
  var done=false;function fin(){if(done)return;done=true;
    if(db){storeMode='indexeddb';}else if(lsOK()){storeMode='local';lsLoad();}else{storeMode='memory';}
    res();}
  setTimeout(fin,2500);
  try{if(!window.indexedDB){fin();return;}var r=indexedDB.open('sor-app',1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('meta');};
    r.onsuccess=function(){if(!done)db=r.result;fin();};r.onerror=function(){fin();};r.onblocked=function(){fin();};
  }catch(e){fin();}
});}
function showStorageWarn(msg){var w=document.getElementById('swarn');if(!w){w=document.createElement('div');w.id='swarn';w.style.cssText='position:fixed;left:0;right:0;top:0;z-index:30;background:#B42318;color:#fff;font:600 13px/1.4 system-ui,sans-serif;padding:10px 14px;text-align:center';document.body.appendChild(w);}w.textContent=msg;}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
function getAll(){return new Promise(function(res){
  if(!db){res(Object.values(mem.items));return;}
  var q=tx('items','readonly').getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){res([]);};
});}
function putItem(it){mem.items[it.id]=it;if(!db){lsSave();return Promise.resolve();}return new Promise(function(res){var q=tx('items','readwrite').put(it);q.onsuccess=res;q.onerror=function(){alert('Could not save — device storage may be full.');res();};});}
function delItem(id){delete mem.items[id];if(!db){lsSave();return Promise.resolve();}return new Promise(function(res){var q=tx('items','readwrite').delete(id);q.onsuccess=res;q.onerror=res;});}
function getMeta(k){if(!db)return Promise.resolve(mem.meta[k]);return new Promise(function(res){var q=tx('meta','readonly').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){res();};});}
function putMeta(k,v){mem.meta[k]=v;if(!db){lsSave();return Promise.resolve();}return new Promise(function(res){var q=tx('meta','readwrite').put(v,k);q.onsuccess=res;q.onerror=res;});}

// ---------- state ----------
var S={view:'home',filter:'all',q:'',items:[],settings:Object.assign({},DEF_SETTINGS),cur:null,draft:null,back:'home',log:{range:'month',from:'',to:'',status:'all',cat:'all',con:'all'}};
var $app=document.getElementById('app');

// ---------- helpers ----------
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n,l){n=String(n);while(n.length<l)n='0'+n;return n;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
function nowTime(){var d=new Date();return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2);}
function fmtDate(iso){if(!iso)return '—';var p=iso.split('-');var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return p[2]+' '+mo[+p[1]-1]+' '+p[0];}
function lines(s){return String(s||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);}
function statusOf(it){if(it.status==='positive')return 'positive';if(it.status==='closed')return 'closed';if(it.due&&it.due<todayISO())return 'overdue';return 'open';}
var SL={open:'Open',overdue:'Overdue',closed:'Closed',positive:'Positive'};
function racCls(r){return r==='+'?'rP':'r'+r;}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
var ICON={
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  team:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  print:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'
};

// ---------- photo compression ----------
function compress(file){return new Promise(function(res){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
      var max=1280,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
      // timestamp stamp
      var stamp=fmtDate(todayISO())+' '+nowTime();x.font='bold '+Math.max(14,Math.round(c.width/40))+'px Arial';
      var tw=x.measureText(stamp).width;x.fillStyle='rgba(0,0,0,.55)';x.fillRect(c.width-tw-20,c.height-Math.round(c.width/40)-18,tw+20,Math.round(c.width/40)+18);
      x.fillStyle='#fff';x.fillText(stamp,c.width-tw-10,c.height-10);
      res(c.toDataURL('image/jpeg',0.72));};
    img.onerror=function(){alert('This photo format could not be read. Please use a JPG/PNG photo.');res(null);};
    img.src=fr.result;};
  fr.onerror=function(){res(null);};
  fr.readAsDataURL(file);
});}

  S.items.forEach(function(it){var s=statusOf(it);c.total++;if(s==='open'||s==='overdue')c.open++;if(s==='overdue')c.overdue++;if(s==='positive')c.positive++;if(it.date===t)c.today++;});return c;}
function filtered(){var q=S.q.toLowerCase();
  return S.items.filter(function(it){var s=statusOf(it);
    if(S.filter==='today'&&it.date!==todayISO())return false;
    if(S.filter==='open'&&!(s==='open'||s==='overdue'))return false;
    if(['overdue','closed','positive'].indexOf(S.filter)>=0&&s!==S.filter)return false;
    if(q){var hay=[it.id,it.cat,it.type,it.loc,it.contractor,it.desc,it.resp].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;

// ---------- log book ----------
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
function logRange(){var L=S.log,now=new Date(),t=todayISO();
  if(L.range==='today')return [t,t];
  if(L.range==='week'){var d=new Date(now);var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);var e=new Date(d);e.setDate(d.getDate()+6);return [isoOf(d),isoOf(e)];}
  if(L.range==='month'){return [isoOf(new Date(now.getFullYear(),now.getMonth(),1)),isoOf(new Date(now.getFullYear(),now.getMonth()+1,0))];}
  if(L.range==='lastmonth'){return [isoOf(new Date(now.getFullYear(),now.getMonth()-1,1)),isoOf(new Date(now.getFullYear(),now.getMonth(),0))];}
  if(L.range==='custom')return [L.from||'0000-00-00',L.to||'9999-99-99'];
  return ['0000-00-00','9999-99-99'];}
function logItems(){var L=S.log,r=logRange();
  return S.items.filter(function(it){var s=statusOf(it);
    if(it.date<r[0]||it.date>r[1])return false;
    if(L.status==='open'&&!(s==='open'||s==='overdue'))return false;
    if(['overdue','closed','positive'].indexOf(L.status)>=0&&s!==L.status)return false;
    if(L.cat!=='all'&&it.cat!==L.cat)return false;
    if(L.con!=='all'&&it.contractor!==L.con)return false;
    return true;}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time);});}
function rangeLabel(){var r=logRange();if(r[0]==='0000-00-00'&&r[1]==='9999-99-99')return 'All records';
  if(r[0]==='0000-00-00')return 'Up to '+fmtDate(r[1]);if(r[1]==='9999-99-99')return 'From '+fmtDate(r[0]);
  return r[0]===r[1]?fmtDate(r[0]):fmtDate(r[0])+' – '+fmtDate(r[1]);}
function summarize(list){var c={total:list.length,open:0,overdue:0,closed:0,positive:0,stop:0,E:0,H:0,M:0,L:0,cats:{},cons:{}};
  list.forEach(function(it){var s=statusOf(it);c[s]++;if(it.stop)c.stop++;if(c[it.rac]!=null)c[it.rac]++;
    c.cats[it.cat]=(c.cats[it.cat]||0)+1;c.cons[it.contractor]=(c.cons[it.contractor]||0)+1;});return c;}
function optList(vals,cur,allLabel){return '<option value="all">'+allLabel+'</option>'+vals.map(function(v){return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>';}).join('');}

  var h='<div class="top"><div class="top-row"><button class="iconbtn" data-act="home" aria-label="Back">'+ICON.back+'</button><div style="flex:1"><div class="brand" style="font-size:18px">LOG BOOK</div><div class="sub">All '+S.items.length+' records stored on this device</div></div></div></div>';

function exportCsv(list,name){

function saveDraft(mode){
  var d=S.draft;if(!d.desc.trim()){alert('Please enter a description of the observation.');return;}
  var isPos=d.type==='Positive';
  if(!isPos&&mode==='open'&&!d.due){if(!confirm('No target date set. Submit anyway?'))return;}
  var it=Object.assign({},d);it.rac=draftRac(d);
  if(!it.id){it.id=nextId();it.createdAt=new Date().toISOString();it.observer=S.settings.observer;it.designation=S.settings.designation;}
  if(isPos){it.status='positive';}
  else if(mode==='closed'){it.status='closed';it.closedAt=todayISO();it.closedBy=S.settings.observer;it.closeNote=it.closeNote||'Corrected on the spot.';if(!it.due)it.due=todayISO();}
  else if(mode==='open'){it.status='open';}
  else if(mode==='edit'&&!isPos&&it.status==='positive'){it.status='open';}
  it.updatedAt=new Date().toISOString();
  putItem(it).then(function(){var i=S.items.findIndex(function(x){return x.id===it.id;});if(i>=0)S.items[i]=it;else S.items.push(it);
    S.cur=it.id;S.view=mode==='edit'?'detail':'home';S.filter='all';render();window.scrollTo(0,0);toast(it.id+' saved');});
}

  var base={before:[],after:[],observer:S.settings.observer||'Sample observer',designation:'SSHO',activity:'',hazard:'',stop:false};
  return [
    Object.assign({},base,{id:'SOR-DEMO-0001',date:t,time:'09:15',type:'Unsafe Act',cat:'Fall Protection',loc:'Bldg 710 · Level 3',contractor:'Subcontractor A',activity:'Scaffold dismantling',desc:'Worker dismantling scaffold at approx. 6 m without harness and lanyard.',hazard:'Fall from height — serious injury or fatality.',sev:1,prob:1,rac:'H',stop:true,immediate:'Work stopped. Harness issued and tied off. On-the-spot toolbox talk.',corrective:'Supervisors to enforce 100% tie-off; refresher TBT for all scaffold crew.',resp:'Sub A foreman',due:t,status:'closed',closedAt:t,closedBy:'SSHO',closeNote:'Corrected on the spot.',createdAt:t+'T09:15'}),
    Object.assign({},base,{id:'SOR-DEMO-0002',date:t,time:'09:40',type:'Unsafe Condition',cat:'Electrical',loc:'Bldg 710 · Level 1',contractor:'Subcontractor B',desc:'Temporary power cord routed through standing water near panel; no GFCI test tag.',hazard:'Electric shock.',sev:1,prob:2,rac:'H',immediate:'Area barricaded; cord de-energised.',corrective:'Re-route cords overhead; GFCI test and tag all temp panels.',resp:'Sub B foreman',due:td,status:'open',createdAt:t+'T09:40'}),
    Object.assign({},base,{id:'SOR-DEMO-0003',date:t,time:'10:05',type:'Positive',cat:'Housekeeping',loc:'Laydown yard',contractor:'Subcontractor A',desc:'Materials stacked, labelled and chocked; walkways clear.',sev:3,prob:4,rac:'+',immediate:'Crew recognised at morning briefing.',status:'positive',createdAt:t+'T10:05'}),
    Object.assign({},base,{id:'SOR-DEMO-0004',date:yd,time:'14:20',type:'Unsafe Condition',cat:'Excavation',loc:'Gate 3',contractor:'Subcontractor B',desc:'Trench approx. 1.8 m deep with no ladder access; spoil pile at edge.',hazard:'Cave-in / unable to exit.',sev:0,prob:3,rac:'H',immediate:'Workers removed from trench.',corrective:'Install ladder access; set spoil back at least 0.6 m.',resp:'Sub B supervisor',due:yd,status:'open',createdAt:yd+'T14:20'})
  ];}

document.addEventListener('click',function(e){
  var el=e.target.closest('button,[data-act]');if(!el||el.tagName==='LABEL')return;
  var f=el.getAttribute('data-filter');if(f){S.filter=S.filter===f&&f!=='all'?'all':f;return renderHome();}
  var o=el.getAttribute('data-open');if(o){S.back=(S.view==='logs'||S.view==='team')?S.view:'home';S.cur=o;S.view='detail';render();window.scrollTo(0,0);return;}
  var tr=el.getAttribute('data-trange');if(tr){S.log.range=tr;return keepScroll(renderTeam);}
  var rg=el.getAttribute('data-range');if(rg){S.log.range=rg;return keepScroll(renderLogs);}
  var t=el.getAttribute('data-type');if(t){S.draft.type=t;return keepScroll(renderForm);}
  var c=el.getAttribute('data-cat');if(c){S.draft.cat=c;return keepScroll(renderForm);}
  var r=el.getAttribute('data-rac');if(r){var p=r.split(',');S.draft.sev=+p[0];S.draft.prob=+p[1];return keepScroll(renderForm);}
  var dp=el.getAttribute('data-delph');if(dp){var q=dp.split(':');
    if(S.view==='form'){S.draft[q[0]].splice(+q[1],1);return keepScroll(renderForm);}
    var it=curItem();if(it&&confirm('Remove this photo?')){it[q[0]].splice(+q[1],1);putItem(it).then(renderDetail);}return;}
  var a=el.getAttribute('data-act');if(!a)return;
  var it2=curItem();
  switch(a){
    case 'new':S.draft=blankDraft();S.view='form';render();window.scrollTo(0,0);break;
    case 'cancel':if(S.draft&&S.draft.id){S.view='detail';}else{S.view='home';}render();break;
    case 'home':S.view='home';render();window.scrollTo(0,0);break;
    case 'backFromDetail':S.view=S.back||'home';render();break;
    case 'logs':S.view='logs';render();window.scrollTo(0,0);break;
    case 'team':S.view='team';render();window.scrollTo(0,0);break;
    case 'logRegister':var lr=logItems();if(!lr.length){alert('No records in this period / filter.');break;}doPrint(registerHTML(lr),true);break;
    case 'logFull':var lf=logItems();if(!lf.length){alert('No records in this period / filter.');break;}
      if(lf.length>40&&!confirm(lf.length+' reports will be generated. This may take a moment. Continue?'))break;
      doPrint(summaryHTML(lf,'SAFETY OBSERVATION SUMMARY')+lf.map(reportHTML).join(''),false);break;
    case 'logCsv':exportCsv(logItems(),'SOR-log-'+todayISO()+'.csv');break;
    case 'stop':S.draft.stop=!S.draft.stop;keepScroll(renderForm);break;
    case 'saveOpen':saveDraft('open');break;
    case 'saveClosed':saveDraft('closed');break;
    case 'saveEdit':saveDraft('edit');break;
    case 'edit':S.draft=JSON.parse(JSON.stringify(it2));S.view='form';render();window.scrollTo(0,0);break;
    case 'delete':if(confirm('Delete '+it2.id+'? This cannot be undone.')){delItem(it2.id).then(function(){S.items=S.items.filter(function(x){return x.id!==it2.id;});S.view='home';render();toast('Deleted');});}break;
    case 'close':
      if(!it2.after.length&&!confirm('No after photo attached. Close anyway?'))break;
      var note=prompt('Close-out note (what was done / verified):',it2.closeNote||'');if(note===null)break;
      it2.status='closed';it2.closedAt=todayISO();it2.closedBy=S.settings.observer;it2.closeNote=note;it2.updatedAt=new Date().toISOString();
      putItem(it2).then(function(){renderDetail();toast(it2.id+' closed');});break;
    case 'reopen':it2.status='open';it2.closedAt='';it2.closedBy='';putItem(it2).then(renderDetail);break;
    case 'printOne':doPrint(reportHTML(it2),false);break;
    case 'settings':S.view='settings';render();window.scrollTo(0,0);break;
    case 'saveSettings':
      $app.querySelectorAll('[data-s]').forEach(function(x){S.settings[x.getAttribute('data-s')]=x.value.trim();});
      putMeta('settings',S.settings).then(function(){S.view='home';render();toast('Settings saved');});break;
    case 'exportJson':download('SOR-backup-'+(S.settings.initials||'device')+'-'+todayISO()+'.json',JSON.stringify({app:'sor-app',v:1,exported:new Date().toISOString(),items:S.items},null,0),'application/json');break;
    case 'exportCsv':exportCsv(S.items,'SOR-register-'+todayISO()+'.csv');break;
    case 'demo':var dd=demoData();Promise.all(dd.map(putItem)).then(function(){dd.forEach(function(x){var i=S.items.findIndex(function(y){return y.id===x.id;});if(i>=0)S.items[i]=x;else S.items.push(x);});renderSettings();toast('Sample data loaded');});break;
    case 'wipe':if(confirm('Delete ALL '+S.items.length+' records on this device? Export a backup first.')&&confirm('Are you sure? This cannot be undone.')){Promise.all(S.items.map(function(x){return delItem(x.id);})).then(function(){S.items=[];renderSettings();toast('All records deleted');});}break;
  }
});
function keepScroll(fn){var y=window.scrollY;fn();window.scrollTo(0,y);}
document.addEventListener('change',function(e){
  var el=e.target;
  var ph=el.getAttribute&&el.getAttribute('data-photo');
  if(ph&&el.files&&el.files[0]){
    compress(el.files[0]).then(function(url){if(!url)return;
      if(S.view==='form'){S.draft[ph].push(url);keepScroll(renderForm);}
      else{var it=curItem();it[ph]=[url];it.updatedAt=new Date().toISOString();putItem(it).then(function(){keepScroll(renderDetail);toast('After photo added');});}
    });return;}
  if(el.getAttribute&&el.getAttribute('data-act-file')==='import'&&el.files&&el.files.length){importFiles([].slice.call(el.files));el.value='';}
});

function importFiles(files){
  var added=0,upd=0,bad=0,people={};
  function one(file){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){var list;
      try{var d=JSON.parse(fr.result);list=Array.isArray(d)?d:d.items;if(!Array.isArray(list))throw 0;}catch(e){bad++;return res();}
      Promise.all(list.map(function(x){if(!x||!x.id)return;var i=S.items.findIndex(function(y){return y.id===x.id;});
        x.before=x.before||[];x.after=x.after||[];if(x.observer)people[x.observer]=1;
        if(i<0){S.items.push(x);added++;return putItem(x);}
        if((x.updatedAt||'')>(S.items[i].updatedAt||'')){S.items[i]=x;upd++;return putItem(x);}
      })).then(res);};fr.onerror=function(){bad++;res();};fr.readAsText(file);});}
  files.reduce(function(p,f){return p.then(function(){return one(f);});},Promise.resolve()).then(function(){
    render();toast('Imported '+files.length+' file(s): '+added+' new, '+upd+' updated'+(bad?' · '+bad+' file(s) not valid':''));
    var n=Object.keys(people).length;if(n)putMeta('lastImport',{at:new Date().toISOString(),files:files.length,added:added,updated:upd});
  });
}

// ---------- install as app ----------
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;if(S.view==='home')render();});
window.addEventListener('appinstalled',function(){deferredPrompt=null;toast('SOR App installed on this phone');if(S.view==='home')render();});
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('[data-install]')&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;render();});}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(function(){});}

// ---------- boot ----------
openDB().then(function(){if(storeMode==='memory')showStorageWarn('This viewer cannot save data. Open the file in Chrome (Android) or Safari (iPhone) — see the instructions you received with the app.');return Promise.all([getAll(),getMeta('settings')]);}).then(function(r){
  S.items=r[0]||[];S.settings=Object.assign({},DEF_SETTINGS,r[1]||{});
  render();
  if(!S.settings.observer){S.view='settings';render();toast('Welcome — enter your name and initials first');}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
});
})();
